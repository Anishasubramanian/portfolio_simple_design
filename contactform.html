<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact form</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css?family=DM+Serif+Display:regular,italic"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Manrope:200,300,regular,500,600,700,800"
      rel="stylesheet"
    />
</head>
<body>
    <div class="container">
        <div class="navbar">
      <h2>AS<span id="span_navbar">. </span></h2>
    </div>
    <div>
      <div class="hero">
        <div class="hero__description">
          <p><span id="span1">_________</span> HELLO I'M</p>
          <h1>Anisha M S</h1>
          <h3>Web Developer</h3>
          <a href="Boilerplate.html" class="hero__btn">Home</a>
        </div>
        <div class="contactform">
        <form class="contactform__form">
        <table>
            <tr>
                <td>
                    <label>Name:</label>
                </td>
                <td>
                    <input type="text" placeholder="Your Name" class="contactform__input">
                </td>
            </tr>
            <tr>
                <td>
                    <label>Email:</label>
                </td>
                <td>
                    <input type="email" placeholder="Your email" class="contactform__input">
                </td>
            </tr>
            <tr>
                <td>
                    <label>Message:</label>
                </td>
                <td>
                    <textarea placeholder="Your Message" class="contactform__textarea"></textarea>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" class="contactform__submit">
                </td>
            </tr>
        </table>
        </form>
        </div>
      </div>
    

   <div class="footer">
        <p>&copy;Anisha</p>
        <a href=""><img src="linkedin.png" alt="" height="20px" width="20px"></a>
    </div>
    
</body>
</html>
